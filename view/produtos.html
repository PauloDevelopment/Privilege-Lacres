<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Produtos</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- JS -->
    <script src="{{ url_for('static', filename='js/scripts.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/produtos.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/usuario.js') }}"></script>
</head>

<body style="display: none;">
    <div class="container-fluid">

        <!-- HEADER -->
        <header class="main-header d-flex align-items-center px-4 py-3">
            <div class="logo-area d-flex align-items-center">
                <div class="icon-box me-2">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                    <h1 class="m-0 h5 fw-bold">Privilege Lacres</h1>
                    <small class="text-danger">Sistema de Gestão</small>
                </div>
            </div>

            <nav class="ms-5 d-flex gap-4">
                <a href="/dashboard-view" class="nav-link text-muted">
                    <i class="fa-solid fa-table-cells-large me-1"></i>
                    Dashboard
                </a>

                <a href="/empresas-view" class="nav-link text-muted">
                    <i class="fa-solid fa-building me-1"></i>
                    Empresas
                </a>

                <a href="/produtos-view"
                   class="nav-link active fw-bold border-bottom border-primary border-2 pb-1 text-primary">
                    <i class="fa-solid fa-box me-1"></i>
                    Produtos
                </a>

                <a href="/pedidos-view" class="nav-link text-muted">
                    <i class="fa-solid fa-file-lines me-1"></i>
                    Pedidos
                </a>

                <a href="/usuarios-view" id="menu-admin" class="nav-link text-muted d-none">
                    <i class="fa-solid fa-users me-1"></i>
                    Usuários
                </a>
            </nav>

            <div class="ms-auto dropdown">
                <a class="nav-link dropdown-toggle text-dark fw-semibold"
                   href="#"
                   role="button"
                   data-bs-toggle="dropdown"
                   aria-expanded="false">
                    <i class="fa-solid fa-user me-1"></i>
                    <span id="user-name">Carregando...</span>
                </a>

                <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                    <li>
                        <a class="dropdown-item" href="#" onclick="abrirPerfil()">
                            <i class="fa-solid fa-user-gear me-2"></i>
                            Meu Perfil
                        </a>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <a class="dropdown-item text-danger" href="#" onclick="logout()">
                            <i class="fa-solid fa-right-from-bracket me-2"></i>
                            Sair
                        </a>
                    </li>
                </ul>
            </div>
        </header>

        <!-- MAIN -->
        <main class="col-12 px-4 py-4">

            <!-- LISTA DE PRODUTOS -->
            <section id="section-list">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="h4 mb-0">Produtos</h2>
                        <p class="text-muted small mb-0">
                            Gerenciar produtos cadastrados no sistema
                        </p>
                    </div>

                    <div class="input-group" style="max-width: 340px;">
                        <span class="input-group-text bg-white border-end-0">
                            <i class="fa-solid fa-magnifying-glass text-muted"></i>
                        </span>
                        <input type="text"
                               id="input-busca-produto"
                               class="form-control border-start-0 ps-0"
                               placeholder="Buscar produto por nome..."
                               oninput="buscarProdutos()">
                    </div>

                    <button class="btn btn-dark btn-save"
                            onclick="showProdutoForm('cadastrar')">
                        <i class="fa-solid fa-plus me-2"></i>
                        Novo Produto
                    </button>
                </div>

                <div class="row g-4" id="produto-list"></div>
            </section>

            <!-- FORMULÁRIO -->
            <section id="section-form" style="display:none;">
                <div class="d-flex align-items-center mb-3">
                    <button class="btn btn-light btn-sm me-3 border"
                            onclick="showProdutoList()">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>

                    <div>
                        <h2 id="produto-form-title" class="h4 mb-0">
                            Novo Produto
                        </h2>
                        <p class="text-muted small mb-0">
                            Preencha os dados do Produto
                        </p>
                    </div>
                </div>

                <div class="card p-4 border-0 shadow-sm">
                    <form class="row g-3" id="produto-form">

                        <div class="col-md-8">
                            <label class="form-label small fw-bold">Nome *</label>
                            <input id="nome_produto" type="text" class="form-control" maxlength="100" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Valor do Milheiro *</label>
                            <div class="input-group">
                                <span class="input-group-text">R$</span>
                                <input id="valor_milheiro"
                                       type="number"
                                       min="0"
                                       step="0.01"
                                       class="form-control"
                                       placeholder="0,00"
                                       required>
                            </div>
                        </div>

                        <div class="col-12 mt-2">
                            <hr class="mb-2">
                            <p class="small fw-bold text-muted mb-2">
                                <i class="fa-solid fa-note-sticky me-1"></i>
                                Descrição
                            </p>
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-bold">Descrição</label>
                            <textarea id="descricao_produto"
                                      class="form-control"
                                      rows="4"
                                      placeholder="Informações adicionais sobre o produto..."></textarea>
                        </div>

                        <div class="col-12 mt-4 text-end">
                            <button type="button"
                                    class="btn btn-light me-2"
                                    onclick="showProdutoList()">
                                Cancelar
                            </button>

                            <button type="submit"
                                    class="btn btn-dark px-4"
                                    id="btn-submit-produto">
                                Salvar Produto
                            </button>
                        </div>

                    </form>
                </div>
            </section>

        </main>
    </div>

    <!-- MODAL PERFIL -->
    <div class="modal fade" id="modalPerfil" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-0">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Meu Perfil</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formPerfil">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Nome</label>
                            <input type="text" id="perfil_nome" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">E-mail</label>
                            <input type="email" id="perfil_email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Nova senha</label>
                            <input type="password" id="perfil_senha" class="form-control">
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0">
                    <button class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-dark" onclick="salvarPerfil()">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL CONFIRMAÇÃO -->
    <div class="modal fade" id="confirmModalProduto" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirmação</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    Deseja realmente excluir este produto?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancelar
                    </button>
                    <button type="button" id="confirm-delete-produto-btn" class="btn btn-danger">
                        Excluir
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="position-fixed top-0 end-0 p-3" style="z-index:9999">
        <div id="liveToast" class="toast align-items-center text-bg-success border-0">
            <div class="d-flex">
                <div class="toast-body" id="toast-message"></div>
                <button type="button"
                        class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast">
                </button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
